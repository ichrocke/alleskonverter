# alleskonverter.de — kompletter Vhost für nginx (neuer Server, CloudPanel).
# Gegenstück zu .htaccess (Apache/Strato): dieselben Regeln, in nginx-Sprache.
# Einbau: CloudPanel → Sites → alleskonverter.de → Vhost → gesamten Inhalt durch diese Datei ersetzen.
# Die {{…}}-Platzhalter füllt CloudPanel beim Speichern selbst (Zertifikat, root, Logs, Einstellungen).
#
# Gegenüber der CloudPanel-Vorlage „PHP“ geändert und warum:
# - Kein Proxy zum PHP-Block auf Port 8080 mehr (der Block ist entfernt): die Seite ist rein statisch,
#   nginx liefert alles direkt aus dem Webverzeichnis.
# - Der Vorlagen-Block „location ~* ^.+\.(css|js|…)$ { expires max; … }“ ist weg: er hielt unser eigenes
#   CSS/JS zehn Jahre im Browser und verschluckte für diese Dateien alle Sicherheitskopfzeilen.
# - Kopfzeilen stehen genau einmal auf server-Ebene, die Werte kommen aus map-Blöcken.
#   Grund: nginx vererbt add_header nur in Blöcke, die selbst KEIN add_header haben.
# - MIME-Typen für .mjs/.wasm/.onnx/.webmanifest/.woff2 je als eigener location mit leerem types {},
#   weil ein types-Block auf server-Ebene die Standardliste ERSETZEN würde.

# ----- Browser-Cache (mod_expires + Header-Regeln der .htaccess). Erster Treffer gewinnt. -----
map $uri $ak_cache {
    default                            "public, max-age=604800";                 # 1 Woche
    ~/$                                "no-cache, must-revalidate";              # Startseite, Werkzeugseiten
    ~\.(html|json|xml|webmanifest)$    "no-cache, must-revalidate";              # HTML immer frisch
    ~^/sw\.js$                         "no-cache, must-revalidate";              # Service Worker darf nie veralten
    ~^/(css|js)/                       "no-cache, must-revalidate";              # eigener Code
    ~^/tools/[^/]+/(css|js)/           "no-cache, must-revalidate";
    ~^/tools/[^/]+/[^/]+\.js$          "no-cache, must-revalidate";
    ~^/assets/                         "public, max-age=86400, must-revalidate"; # eigene Bilder: 1 Tag
    ~\.(woff2|wasm|onnx|mjs)$          "public, max-age=31536000, immutable";    # Bibliotheken, Modelle, Schriften
    ~\.(css|js)$                       "public, max-age=31536000";               # Fremdbibliotheken (vendor/)
    ~\.(png|jpe?g|webp|svg|ico)$       "public, max-age=15552000";               # 6 Monate
}

# ----- Service Worker: Geltungsbereich „/“ (leerer Wert = Kopfzeile wird nicht gesendet) -----
map $uri $ak_sw {
    default      "";
    ~^/sw\.js$   "/";
}

# ----- Transkription: „cross-origin isolated“, damit SharedArrayBuffer verfügbar ist und die
# ONNX-Laufzeit mehrere Prozessorkerne nutzen darf (sonst Faktor 3–4 langsamer).
# Entspricht tools/transkription/.htaccess. -----
map $uri $ak_coop {
    default                     "";
    ~^/tools/transkription/     "same-origin";
}
map $uri $ak_coep {
    default                     "";
    ~^/tools/transkription/     "require-corp";
}

# ----- Kanonische Adresse: www entfernen -----
server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.alleskonverter.de;
  return 301 https://alleskonverter.de$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name alleskonverter.de www1.alleskonverter.de;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # ----- Statische Auslieferung, Fehlerseite, keine Verzeichnislisten -----
  index index.html;
  error_page 404 /404.html;
  autoindex off;

  location / {
    try_files $uri $uri/ =404;
  }

  # Versteckte Dateien (.htaccess, .git …) nie ausliefern — .well-known ist oben erlaubt
  location ~ /\.(?!well-known) {
    deny all;
  }

  # ----- Kompression (mod_deflate) — WASM lohnt sich besonders (ffmpeg-Kern) -----
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/xml text/javascript application/javascript
             application/x-javascript application/json application/xml application/rss+xml
             image/svg+xml application/manifest+json application/wasm;

  # ----- MIME-Typen, die nginx hier sonst als application/octet-stream liefert -----
  location ~ \.mjs$         { types { } default_type text/javascript;             try_files $uri =404; }
  location ~ \.wasm$        { types { } default_type application/wasm;            try_files $uri =404; }
  location ~ \.onnx$        { types { } default_type application/octet-stream;    try_files $uri =404; }
  location ~ \.webmanifest$ { types { } default_type application/manifest+json;   try_files $uri =404; }
  location ~ \.woff2$       { types { } default_type font/woff2;                  try_files $uri =404; }

  # ----- Kopfzeilen: einmal für alles, Werte aus den maps -----
  add_header Cache-Control $ak_cache always;
  add_header Service-Worker-Allowed $ak_sw;
  add_header Cross-Origin-Opener-Policy $ak_coop;
  add_header Cross-Origin-Embedder-Policy $ak_coep;

  # Sicherheitskopfzeilen
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
}
