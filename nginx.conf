# alleskonverter.de — Serverkonfiguration für nginx (neuer Server, CloudPanel).
# Gegenstück zu .htaccess (Apache/Strato): dieselben Regeln, in nginx-Sprache.
#
# Einbau in CloudPanel: Sites → alleskonverter.de → Vhost.
#   1. Die drei map-Blöcke VOR das „server {“ setzen (sie dürfen nicht im server-Block stehen).
#   2. Im server-Block alles unterhalb von {{settings}} durch den Teil „IM SERVER-BLOCK“ ersetzen,
#      insbesondere den vorgegebenen Block
#        location ~* ^.+\.(css|js|jpg|…)$ { add_header Access-Control-Allow-Origin "*"; expires max; … }
#      entfernen — er würde unseren Code ein Jahr lang im Browser festhalten und
#      alle Sicherheitskopfzeilen für diese Dateien verschlucken.
#   3. „Vhost speichern“ prüft die Konfiguration (nginx -t) und lädt nginx neu.
#
# Warum alles über map + add_header auf server-Ebene und nichts in location-Blöcken:
# nginx vererbt add_header nur an Blöcke, die selbst KEIN add_header haben. Ein einziges
# add_header in einem location-Block löscht dort alle Sicherheitskopfzeilen des Servers.
# Deshalb entscheiden die maps anhand der Adresse, und der server-Block setzt alles einmal.

# ===================== VOR DEM SERVER-BLOCK =====================

# Browser-Cache — entspricht mod_expires + den Header-Regeln der .htaccess.
# Reihenfolge zählt: der erste passende Ausdruck gewinnt.
map $uri $ak_cache {
    default                            "public, max-age=604800";                 # 1 Woche (ExpiresDefault)
    ~/$                                "no-cache, must-revalidate";              # Startseite, Werkzeugseiten
    ~\.(html|json|xml|webmanifest)$    "no-cache, must-revalidate";              # HTML immer frisch
    ~^/sw\.js$                         "no-cache, must-revalidate";              # Service Worker darf nie veralten
    ~^/(css|js)/                       "no-cache, must-revalidate";              # eigener Code (EIGENER_CODE)
    ~^/tools/[^/]+/(css|js)/           "no-cache, must-revalidate";
    ~^/tools/[^/]+/[^/]+\.js$          "no-cache, must-revalidate";
    ~^/assets/                         "public, max-age=86400, must-revalidate"; # eigene Bilder: 1 Tag
    ~\.(woff2|wasm|onnx|mjs)$          "public, max-age=31536000, immutable";    # Fremdbibliotheken, Modelle, Schriften
    ~\.(css|js)$                       "public, max-age=31536000";               # Fremdbibliotheken (vendor/)
    ~\.(png|jpe?g|webp|svg|ico)$       "public, max-age=15552000";               # 6 Monate
}

# Service Worker: Geltungsbereich „/“ (leerer Wert = Kopfzeile wird nicht gesendet)
map $uri $ak_sw {
    default      "";
    ~^/sw\.js$   "/";
}

# Transkription: Seite „cross-origin isolated“ ausliefern, damit SharedArrayBuffer
# verfügbar ist und die ONNX-Laufzeit mehrere Prozessorkerne nutzen darf
# (ohne diese Kopfzeilen bleibt nur ein Kern — Faktor 3–4 langsamer).
# Entspricht tools/transkription/.htaccess. Leerer Wert = Kopfzeile wird nicht gesendet.
map $uri $ak_coop {
    default                     "";
    ~^/tools/transkription/     "same-origin";
}
map $uri $ak_coep {
    default                     "";
    ~^/tools/transkription/     "require-corp";
}

# ===================== IM SERVER-BLOCK (unterhalb von {{settings}}) =====================

    # ----- Kanonische Adresse: www entfernen -----
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # ----- Startdatei, Fehlerseite, keine Verzeichnislisten -----
    index index.html;
    error_page 404 /404.html;
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Versteckte Dateien (.htaccess, .git …) nie ausliefern — außer .well-known für Zertifikate
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ----- Kompression (mod_deflate) — WASM lohnt sich besonders (ffmpeg-Kern) -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/x-javascript application/json application/xml application/rss+xml
               image/svg+xml application/manifest+json application/wasm;

    # ----- MIME-Typen, die nginx nicht sicher von Haus aus kennt -----
    # (ein types-Block auf server-Ebene würde die Standardliste ERSETZEN, deshalb je ein location)
    location ~ \.mjs$         { types { } default_type text/javascript;             try_files $uri =404; }
    location ~ \.wasm$        { types { } default_type application/wasm;            try_files $uri =404; }
    location ~ \.onnx$        { types { } default_type application/octet-stream;    try_files $uri =404; }
    location ~ \.webmanifest$ { types { } default_type application/manifest+json;   try_files $uri =404; }
    location ~ \.woff2$       { types { } default_type font/woff2;                  try_files $uri =404; }

    # ----- Kopfzeilen: einmal für alles, Werte kommen aus den maps -----
    add_header Cache-Control $ak_cache always;
    add_header Service-Worker-Allowed $ak_sw;
    add_header Cross-Origin-Opener-Policy $ak_coop;
    add_header Cross-Origin-Embedder-Policy $ak_coep;

    # Sicherheitskopfzeilen
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
