name: Werkzeuge testen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testabhängigkeiten installieren
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Website ausliefern und Werkzeuge durchtesten
        working-directory: tests
        run: npm test
